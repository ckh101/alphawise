# 生产环境配置

app:
  name: "harness-investment-research"
  version: "0.1.0"
  environment: "production"
  debug: false
  description: "Harness 投资研究平台 - 生产环境"

server:
  host: "127.0.0.1"
  port: 9998
  workers: 1
  reload: false

logging:
  level: "INFO"
  console: true
  file: true
  rotation: "500 MB"
  retention: "30 days"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {name}:{function}:{line} | {message}"

tracing:
  enabled: true
  sample_rate: 0.1
